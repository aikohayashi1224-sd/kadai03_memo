<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシピ管理メモ</title>
    <script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h1>レシピ管理メモ</h1>

  <main>
    <div class="input-area">
      <input id="title" type="text" placeholder="レシピ名">
      <input id="url" type="url" placeholder="URL">
      <textarea id="text" placeholder="概要・メモ"></textarea>
    </div>

    <div class="button-area">
      <button id="save">セーブ</button>
      <button id="clear">全て削除</button>
    </div>
  </main>

  <ul id="list">
    </ul>

  <footer>
    ※レシピは個人として使用し、都度URLを参照すること
  </footer>

  <script>
    // 共通のHTML作成関数（セーブ時とページ読み込み時で使い回します）
    function createListHtml(key, url, value) {
      // URLが空でなければリンクにし、空ならテキストにする処理
      const urlHtml = url ? `<p class="recipe-url"><a href="${url}" target="_blank">レシピを見る (外部サイト)</a></p>` : '';
      
      return `
        <li data-key="${key}">
          <div class="list-content">
            <h3 class="recipe-title">${key}</h3>
            ${urlHtml}
            <p class="recipe-text">${value}</p>
          </div>
          <button class="delete-btn">削除</button>
        </li>
      `;
    }

    //1.Save クリックイベント
    $("#save").on("click", function () {
      const key = $("#title").val().trim();
      const url = $("#url").val().trim();
      const value = $("#text").val().trim();

      // レシピ名が空の場合は保存しない
      if (!key) {
        alert("レシピ名を入力してください");
        return;
      }

      // 複数のデータをオブジェクトにまとめる
      const recipeData = {
        url: url,
        text: value
      };

      // LocalStorageには文字列しか保存できないため、JSON文字列に変換して保存
      localStorage.setItem(key, JSON.stringify(recipeData));

      // 画面のリストに追加
      const html = createListHtml(key, url, value);
      $("#list").append(html);

      // 入力フォームを空にする
      $("#title").val("");
      $("#url").val("");
      $("#text").val("");
    });


    //2.clear クリックイベント（全て削除）
    $("#clear").on("click", function () {
      if (confirm("本当に全てのレシピを削除しますか？")) {
        localStorage.clear();
        $("#list").empty();
      }
    });


    //3. 1件削除のクリックイベント
    // 動的に追加された要素に対してイベントを設定するため $(document).on を使います
    $(document).on("click", ".delete-btn", function() {
      // クリックされたボタンの親要素(li)から、レシピ名(key)を取得
      const $li = $(this).closest("li");
      const key = $li.data("key");

      // LocalStorageから削除
      localStorage.removeItem(key);
      // 画面から削除
      $li.remove();
    });


    //4.ページ読み込み：保存データ取得表示
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      
      try {
        // 保存されたJSON文字列を元のオブジェクトに復元
        const recipeData = JSON.parse(localStorage.getItem(key));
        const html = createListHtml(key, recipeData.url, recipeData.text);
        $("#list").append(html);
      } catch (e) {
        // 万が一、古い単純なテキストデータが残っていた場合のフォールバック処理
        const value = localStorage.getItem(key);
        const html = createListHtml(key, "", value);
        $("#list").append(html);
      }
    }
  </script>
    
</body>


</html>
